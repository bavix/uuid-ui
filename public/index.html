    <!--
      The theme has to be on <html> before the first paint. Applying it from the
      component ran after the page had already painted in light, so every dark
      load started with a white flash.
    -->
    <script>
        (function () {
            try {
                // Kept in step with src/theme.js by hand: this runs before any
                // bundle exists, so it cannot import the module. The stored
                // value is "theme:variant"; the words older builds wrote still
                // mean the shipped theme.
                var stored = localStorage.getItem('theme') || '';

                // A first visit draws a theme. vite.config.js fills the list in.
                if (stored === '' && localStorage.getItem('uuid.data') === null) {
                    var pool = ["default","solarized","catppuccin","gruvbox","cyberpunk"];

                    stored = pool[Math.floor(Math.random() * pool.length)] + ':system';
                    localStorage.setItem('theme', stored);
                }

                var pair = stored.split(':');
                var palette = pair.length === 2 ? pair[0] : 'default';
                var mode = pair.length === 2 ? pair[1] : stored;

                if (mode === 'true' || mode === '"true"') {
                    mode = 'dark';
                }

                if (mode === 'false' || mode === '"false"') {
                    mode = 'light';
                }

                if (mode !== 'dark' && mode !== 'light') {
                    mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }

                var root = document.documentElement;

                if (mode === 'dark') {
                    root.classList.add('dark');
                }

                root.style.colorScheme = mode;

                if (/^[a-z0-9][a-z0-9-]{0,31}$/.test(palette) && palette !== 'default') {
                    root.setAttribute('data-theme', palette);
                }
            } catch (e) {
            }
        })();
    </script>
