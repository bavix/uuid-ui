    <!--
      The theme has to be on <html> before the first paint. Applying it from the
      component ran after the page had already painted in light, so every dark
      load started with a white flash.
    -->
    <script>
        (function () {
            try {
                // Kept in step with src/theme.js by hand: this runs before any
                // bundle exists, so it cannot import the module.
                var stored = localStorage.getItem('theme');
                var dark = stored === 'dark' || stored === 'true'
                    || ((stored === null || stored === '') && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
            }
        })();
    </script>
